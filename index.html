<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Calculator</h1>

    
    <div class="container shadow">
        <div id="display" class="shadow">0</div>
        <div class="row">
            <button id="clear">C</button>
            <button id="delete">⌫</button>
            <button id="divide">÷</button>
        </div>
        <div class="row">
            <button id="nb-7">7</button>
            <button id="nb-8">8</button>
            <button id="nb-9">9</button>
            <button id="multiply">×</button>
        </div>
        <div class="row">
            <button id="nb-4">4</button>
            <button id="nb-5">5</button>
            <button id="nb-6">6</button>
            <button id="subtract">-</button>
        </div>
        <div class="row">
            <button id="nb-1">1</button>
            <button id="nb-2">2</button>
            <button id="nb-3">3</button>
            <button id="add">+</button>
        </div>
        <div class="row">
            <button id="plus-minus">±</button>
            <button id="nb-0">0</button>
            <button id="comma">.</button>
            <button id="equal">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
